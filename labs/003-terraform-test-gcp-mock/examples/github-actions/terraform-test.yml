# Copy to .github/workflows/terraform-test.yml at the root of your repo.
# Runs `terraform test` on every pull request. No GCP project, no secrets:
# the tests use mock_provider "google", so there is nothing to authenticate.
name: terraform-test

on:
  pull_request:
    paths:
      - "labs/003-terraform-test-gcp-mock/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/003-terraform-test-gcp-mock

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Test (mocked google provider)
        run: terraform test -junit-xml=terraform-test.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-report
          path: labs/003-terraform-test-gcp-mock/terraform-test.xml
